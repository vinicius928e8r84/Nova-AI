name: Registro da PR

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: registro-da-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  registro-da-pr:
    name: Registro da PR
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 24
      - name: Usar as regras da base
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/$BASE:refs/remotes/origin/$BASE"
          if git cat-file -e "origin/$BASE:scripts/regras/registro-da-pr.js" 2>/dev/null; then
            mkdir -p "$RUNNER_TEMP/regras-da-base"
            git archive "origin/$BASE" scripts/regras | tar -x -C "$RUNNER_TEMP/regras-da-base"
            echo "REGRAS_DIR=$RUNNER_TEMP/regras-da-base/scripts/regras" >> "$GITHUB_ENV"
          else
            echo "REGRAS_DIR=$GITHUB_WORKSPACE/scripts/regras" >> "$GITHUB_ENV"
          fi
      - run: node "$REGRAS_DIR/registro-da-pr.js"
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}

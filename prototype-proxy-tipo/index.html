<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nova AI — teste do campo de proxy (tipo + leitura)</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; background:#05080D; color:#E8EDF5; font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; padding:28px 18px 60px; }
  h1 { font-size:13px; letter-spacing:.22em; text-transform:uppercase; color:#A78BFA; margin:0 0 4px; font-weight:900; }
  .sub { font-size:11px; color:#5F6B7D; margin:0 0 22px; }
  .panel { max-width:660px; background:rgba(15,22,34,.92); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:18px; }
  .lbl { display:block; font-size:9px; font-weight:800; letter-spacing:.18em; text-transform:uppercase; color:#66708A; margin-bottom:6px; }
  .row { display:flex; gap:8px; }
  select { background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1); color:#E8EDF5; border-radius:12px; padding:10px 8px; font-size:10px; font-weight:900; letter-spacing:.08em; text-transform:uppercase; outline:none; }
  select:focus, input:focus { border-color:rgba(167,139,250,.6); }
  input { flex:1; min-width:0; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.1); color:#E8EDF5; border-radius:12px; padding:10px 14px; font-size:12px; font-weight:700; outline:none; }
  input::placeholder { color:rgba(255,255,255,.2); font-weight:600; }
  button { background:rgba(167,139,250,.12); border:1px solid rgba(167,139,250,.45); color:#D8CCFF; border-radius:12px; padding:10px 14px; font-size:10px; font-weight:900; letter-spacing:.1em; text-transform:uppercase; cursor:pointer; }
  button:hover { background:rgba(167,139,250,.22); }
  .info { font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; margin:8px 0 0; color:#7A8699; }
  .info.ok { color:#7A8699; }
  .info.warn { color:#FBBF24; }
  .info.err { color:#F87171; }
  .out { margin-top:10px; padding:10px 12px; border-radius:12px; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.06); font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace; color:#93A0B4; word-break:break-all; }
  .out b { color:#5EEAD4; font-weight:700; }
  table { width:100%; border-collapse:collapse; margin-top:26px; max-width:980px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid rgba(255,255,255,.05); font-size:11px; vertical-align:top; }
  th { color:#66708A; font-size:9px; letter-spacing:.16em; text-transform:uppercase; }
  td.mono { font-family:ui-monospace,Menlo,monospace; color:#B8C2D4; word-break:break-all; }
  td.res { font-family:ui-monospace,Menlo,monospace; color:#5EEAD4; word-break:break-all; }
  td.res.no { color:#F87171; }
  .use { padding:4px 8px; font-size:9px; }
</style>
</head>
<body>
<h1>Controle do celular · proxy do dispositivo</h1>
<p class="sub">Protótipo de teste (fora do app). Nada aqui toca no iPhone: só lê o texto e mostra o que entra em cada campo.</p>

<div class="panel">
  <label class="lbl" for="tipo">Tipo da proxy</label>
  <div class="row">
    <select id="tipo" title="Tipo da proxy">
      <option value="socks5">SOCKS5</option>
      <option value="socks5h">SOCKS5H</option>
      <option value="http">HTTP</option>
      <option value="https">HTTPS</option>
      <option value="socks4">SOCKS4</option>
    </select>
    <input id="proxy" type="text" spellcheck="false" placeholder="cole em qualquer formato: host:porta@usuario:senha" />
    <button id="salvar">Salvar</button>
  </div>
  <p id="info" class="info"></p>
  <div id="out" class="out"></div>
</div>

<table id="casos">
  <thead><tr><th>Formato colado</th><th>O que ele extrai</th><th>Enviado ao iPhone</th><th></th></tr></thead>
  <tbody></tbody>
</table>

<script src="../MAC/integracao-iphone/conexao-usb/proxy-parse.js"></script>
<script>
const PV = PV_EXPORTS;
const SENHA = "segredoFalso_country-US_mode-quality_session-AAAABBBB_lifetime-1440";
const campo = document.getElementById("proxy");
const tipo = document.getElementById("tipo");
const info = document.getElementById("info");
const out = document.getElementById("out");

function desenha() {
  const bruto = campo.value;
  const o = PV.parse(bruto);
  tipo.value = PV.schemeOf(bruto);
  if (!bruto.trim()) {
    info.className = "info";
    info.textContent = "cole a proxy em qualquer formato: host:porta@usuario:senha, usuario:senha@host:porta ou host:porta:usuario:senha";
    out.innerHTML = "";
    return;
  }
  if (!o) {
    info.className = "info err";
    info.textContent = "não achei host e porta nessa string — confira se a porta veio junto";
    out.innerHTML = "";
    return;
  }
  const sc = PV.schemeOf(bruto);
  const soSocks = sc === "socks5" || sc === "socks5h";
  info.className = "info " + (soSocks ? "ok" : "warn");
  info.textContent = (o.scheme || "socks5") + " · " + o.host + ":" + o.port +
    " · " + (o.user ? "usuário " + o.user : "sem usuário") +
    " · " + (o.pass ? "senha " + o.pass.length + " caracteres" : "sem senha") +
    (soSocks ? "" : " — o aparelho hoje só aplica socks5/socks5h");
  out.innerHTML = "vai para o iPhone como:<br><b>" + PV.norm(bruto) + "</b>";
}

campo.addEventListener("input", desenha);
tipo.addEventListener("change", () => { campo.value = PV.withScheme(tipo.value, campo.value); desenha(); });
document.getElementById("salvar").addEventListener("click", desenha);
desenha();

const casos = [
  "premium-residential.evomi.com:1002@usuariofalso:" + SENHA,
  "usuariofalso:" + SENHA + "@premium-residential.evomi.com:1002",
  "socks5://premium-residential.evomi.com:1002:usuariofalso:" + SENHA,
  "http://aquiles:segredo@us.exemplo.com:8080",
  "us.exemplo.com:1001:aquiles:segredo",
  "aquiles:segredo:us.exemplo.com:9000",
  "1.2.3.4:8000",
  "socks5h://aquiles:pa:ss@host.exemplo.com:1080",
  "premium-residential.evomi.com",
  "host.exemplo.com:99999",
  "proxy da evomi"
];
const tb = document.querySelector("#casos tbody");
casos.forEach((c) => {
  const o = PV.parse(c);
  const tr = document.createElement("tr");
  const mascarado = (t) => t.split(SENHA).join("<senha>");
  tr.innerHTML = "<td class='mono'>" + mascarado(c) + "</td>" +
    "<td class='mono'>" + (o ? o.host + ":" + o.port + " · " + (o.user || "—") + " · senha " + (o.pass ? o.pass.length + "c" : "—") : "recusa") + "</td>" +
    "<td class='res " + (o ? "" : "no") + "'>" + (o ? mascarado(PV.norm(c)) : "—") + "</td>" +
    "<td><button class='use'>usar</button></td>";
  tr.querySelector("button").addEventListener("click", () => { campo.value = c; desenha(); campo.focus(); });
  tb.appendChild(tr);
});
</script>
</body>
</html>

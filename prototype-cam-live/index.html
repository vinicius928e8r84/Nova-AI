<!doctype html>
<!-- Site de teste do CAM LIVE: carrega o MÓDULO REAL (../MAC/integracao-camlive/cam-live*.js), o mesmo que vai para o app.
     Sem o app, a transmissão e o sensor do iPhone são simulados aqui. Para transmitir de verdade para um servidor de teste:
     cd ../MAC/integracao-camlive/test && node harness.js  ->  http://localhost:8765 -->
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NOVA — CAM LIVE (site de teste)</title>
<link href="https://fonts.googleapis.com/css2?family=Righteous&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0F172A;color:#cbd5e1;font-family:system-ui,sans-serif;height:100vh;overflow:hidden;
    background-image:radial-gradient(1200px 600px at 60% 40%,rgba(0,229,255,.06),transparent 60%),radial-gradient(800px 500px at 10% 90%,rgba(167,139,250,.06),transparent 60%)}
  .topbar{height:60px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid rgba(0,229,255,.14);background:rgba(5,10,24,.9)}
  .brand{display:flex;align-items:center;gap:10px;margin-right:8px}.brand i{width:32px;height:32px;border-radius:50%;background:conic-gradient(#ff5f6d,#ffc371,#00e5ff,#a78bfa,#ff5f6d)}
  .brand b{font:13px 'Righteous';letter-spacing:.12em;color:#fff}
  .tb{padding:8px 14px;border-radius:8px;border:1px solid;font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;font-family:'Righteous',cursive}
  .tb.cyan{color:#00e5ff;border-color:rgba(0,229,255,.2);background:rgba(0,229,255,.05)}.tb.violet{color:#c4b5fd;border-color:rgba(139,92,246,.4);background:rgba(139,92,246,.1)}
  .tb.green{color:#00ff8f;border-color:rgba(0,255,143,.2);background:rgba(0,255,143,.05)}.tb.red{color:#f87171;border-color:rgba(239,68,68,.3);background:rgba(239,68,68,.1)}
  .note{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:#000b;border:1px solid rgba(0,229,255,.2);border-radius:999px;padding:8px 16px;font-size:12px;z-index:5}
  .note b{color:#ffb020}
  .camera-test{margin:14px;padding:16px;width:min(360px,calc(100% - 28px));border:1px solid #733842;border-radius:12px;background:#101522}
  .camera-test h2{font-size:15px;color:#fda4af;margin-bottom:8px}
  .camera-test p{font-size:12px;margin:8px 0}
  .camera-test .actions{display:flex;gap:8px}
  .camera-test button{opacity:.55}
  .camera-test button[aria-pressed="true"]{opacity:1;border-color:currentColor}
  .camera-test .tb.green[aria-pressed="true"]{background:#073c2a}
  .camera-test .tb.red[aria-pressed="true"]{background:#4b1720}
  .camera-preview{margin-top:12px;min-height:112px;display:grid;place-items:center;border:1px solid #2b3448;border-radius:8px;background:#172034;overflow:hidden;font-size:12px}
  .camera-preview[data-injected="true"]{background:#000}
  .camera-preview img{width:100%;height:160px;object-fit:contain}

<body>
<div class="topbar"><div class="brand"><i></i><b>NOVA</b></div>
  <button class="tb cyan">Gravação de tela</button><button class="tb violet">Fazenda de Navegadores</button><button class="tb cyan">Controle do Celular</button>
  <button class="tb green">Ponte de câmera móvel</button><button class="tb red">Envio com IA</button></div>
<section class="camera-test" id="camera-test" data-phone-control-window>
  <h2>Sequestro de Câmera</h2>
  <p id="camera-status" role="status"></p>
  <div class="actions">
    <button class="tb green" id="inject-on">Ligar</button>
    <button class="tb red" id="inject-off">Desligar</button>
  </div>
  <div class="camera-preview" id="camera-preview">
    <span id="real-camera">Sensor do iPhone (simulado)</span>
    <img id="injected-frame" alt="Imagem transmitida pelo CAM LIVE" hidden>
  </div>
</section>
<div class="note">Demonstração dos controles. Abra o <b>CAM LIVE</b> e adicione uma cena para testar.</div>

<script>
(() => {
  const listeners = {};
  const emit = (channel, payload) => (listeners[channel] || []).forEach(fn => fn(payload));
  const panel = document.querySelector('#camera-test');
  const on = document.querySelector('#inject-on'), off = document.querySelector('#inject-off');
  const preview = document.querySelector('#camera-preview');
  const frame = document.querySelector('#injected-frame');
  const sensor = document.querySelector('#real-camera');
  const status = document.querySelector('#camera-status');
  let injection = false, target = null, frameUrl = null, frameTimeout, encoderReady = false, announced = false;
  function render() {
    on.disabled = injection;
    off.disabled = !injection;
    on.setAttribute('aria-pressed', String(injection));
    off.setAttribute('aria-pressed', String(!injection));
    preview.dataset.injected = String(injection);
    sensor.hidden = injection;
    frame.hidden = !injection || !frameUrl;
    if (frameUrl && !frame.hidden) frame.src = frameUrl;
    else frame.removeAttribute('src');
    status.textContent = !injection ? 'Câmera real'
      : frameUrl ? 'Injeção ligada · recebendo CAM LIVE' : 'Injeção ligada · tela preta';
  }
  function clearFrame() {
    clearTimeout(frameTimeout);
    if (frameUrl) URL.revokeObjectURL(frameUrl);
    frameUrl = null;
    render();
  }
  on.onclick = () => { injection = true; render(); };
  off.onclick = () => { injection = false; render(); };
  document.querySelector('.topbar .tb:nth-of-type(3)').onclick = () => { panel.hidden = !panel.hidden; };
  render();

  window.electronAPI = {
    isMobile: false,
    on(channel, fn) {
      (listeners[channel] ||= []).push(fn);
      return () => { listeners[channel] = listeners[channel].filter(listener => listener !== fn); };
    },
    send() {},
    async invoke(channel, arg) {
      if (channel === 'camlive:start') {
        target = arg.target;
        encoderReady = false;
        announced = false;
        if (target === 'rtmp') setTimeout(() => {
          if (target === 'rtmp') emit('camlive:status', {status: 'AO VIVO'});
        }, 100);
        return {ok: true};
      }
      if (channel === 'camlive:stop') { target = null; clearFrame(); return {ok: true}; }
      if (channel === 'camlive:frame' && target === 'iphone') {
        clearTimeout(frameTimeout);
        if (frameUrl) URL.revokeObjectURL(frameUrl);
        frameUrl = URL.createObjectURL(new Blob([arg], {type: 'image/jpeg'}));
        frameTimeout = setTimeout(clearFrame, 1000);
        render();
        if (encoderReady && !announced) {
          announced = true;
          emit('camlive:status', {status: 'AO VIVO'});
        }
        return {ok: true};
      }
      if (channel === 'camlive:pcm' && target === 'iphone') {
        encoderReady = true;
        return {ok: true};
      }
      if (channel === 'screen-recorder:get-sources') return [];
      return null;
    },
  };
})();
</script>
<script>
/* CAM LIVE — mixer de áudio + captura AAC (renderer do Electron / Chromium, sem dependências).
 *
 * REGRA INEGOCIÁVEL: o áudio vem SOMENTE dos arquivos de vídeo/áudio colocados nas cenas
 * (elementos <video>/<audio> ligados com attach). Este módulo NUNCA chama getUserMedia e
 * nunca captura microfone nem o áudio do computador/sistema.
 *
 * API (window.CamLiveAudio):
 *   attach(id, mediaEl) -> bool          liga o elemento ao mixer (createMediaElementSource, só uma vez por elemento)
 *   detach(id)                           desliga e esquece o canal
 *   setParams(id, {volume, muted, visible, monitor})
 *   levels() -> {master: dB, channels: {id: dB}}
 *   resume()                             retoma o AudioContext (chamar em gesto do usuário)
 *   supported() -> Promise<boolean>      AAC-LC 48 kHz estéreo disponível no AudioEncoder?
 *   startCapture({t0Ms, bitrateKbps, onAsc, onPacket, onError}) -> Promise<{ok, error?}>
 *   stopCapture() -> Promise
 */
(function () {
  'use strict';

  var SR = 48000, BLOCK = 1024, WORKLET_FRAMES = 128, FFT = 2048, FLOOR_DB = -100;
  var AAC_CODEC = 'mp4a.40.2';

  var ctx = null;            // AudioContext (preguiçoso)
  var master = null;         // GainNode (soma de todos os canais)
  var masterAn = null;       // AnalyserNode do master
  var channels = {};         // id -> {id, el, src, gain, an, mon, params}
  var sources = new WeakMap(); // elemento -> MediaElementAudioSourceNode (só se cria uma vez por elemento)
  var pending = {};          // parâmetros recebidos antes do attach
  var buf = null;            // Float32Array reutilizado por levels()
  var workletReady = false;
  var cap = null;            // estado da captura em andamento
  var supportedP = null;

  function msg(e) { return (e && e.message) ? e.message : String(e); }

  function ensureCtx() {
    if (ctx && ctx.state !== 'closed') return ctx;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) throw new Error('Este navegador não tem Web Audio (AudioContext).');
    ctx = new AC({ sampleRate: SR, latencyHint: 'interactive' });
    workletReady = false;
    master = ctx.createGain();
    master.channelCount = 2; master.channelCountMode = 'explicit'; master.channelInterpretation = 'speakers';
    masterAn = ctx.createAnalyser(); masterAn.fftSize = FFT; masterAn.smoothingTimeConstant = 0;
    master.connect(masterAn);
    buf = new Float32Array(FFT);
    return ctx;
  }

  function defaults(p) {
    p = p || {};
    return {
      volume: typeof p.volume === 'number' && isFinite(p.volume) ? Math.max(0, Math.min(1, p.volume)) : 1,
      muted: !!p.muted,
      visible: p.visible === undefined ? true : !!p.visible,
      monitor: !!p.monitor,
    };
  }

  function applyParams(ch) {
    if (!ctx) return;
    var p = ch.params, t = ctx.currentTime;
    var g = (p.visible && !p.muted) ? p.volume : 0;
    try { ch.gain.gain.setTargetAtTime(g, t, 0.008); } catch (_) { ch.gain.gain.value = g; }
    try { ch.mon.gain.setTargetAtTime(p.monitor ? 1 : 0, t, 0.008); } catch (_) { ch.mon.gain.value = p.monitor ? 1 : 0; }
  }

  function peakDb(an) {
    an.getFloatTimeDomainData(buf);
    var pk = 0;
    for (var i = 0; i < buf.length; i++) { var v = buf[i]; if (v < 0) v = -v; if (v > pk) pk = v; }
    if (pk <= 0) return FLOOR_DB;
    var db = 20 * Math.log10(pk);
    return db < FLOOR_DB || !isFinite(db) ? FLOOR_DB : db;
  }

  function safeDisconnect(n, to) { try { if (to) n.disconnect(to); else n.disconnect(); } catch (_) {} }

  /* ───────────────────────── mixer ───────────────────────── */

  function attach(id, mediaEl) {
    try {
      if (id === undefined || id === null || !mediaEl) return false;
      id = String(id);
      var cur = channels[id];
      if (cur && cur.el === mediaEl) return true;       // idempotente
      if (cur) detach(id);                               // mesmo id com outro elemento
      ensureCtx();
      var src = sources.get(mediaEl);
      if (!src) { src = ctx.createMediaElementSource(mediaEl); sources.set(mediaEl, src); }
      var gain = ctx.createGain(), an = ctx.createAnalyser(), mon = ctx.createGain();
      an.fftSize = FFT; an.smoothingTimeConstant = 0;
      gain.gain.value = 0; mon.gain.value = 0;
      src.connect(gain);
      gain.connect(an);
      gain.connect(master);
      gain.connect(mon);
      mon.connect(ctx.destination);
      var ch = { id: id, el: mediaEl, src: src, gain: gain, an: an, mon: mon, params: defaults(pending[id]) };
      channels[id] = ch;
      applyParams(ch);
      return true;
    } catch (e) {
      try { console.warn('[CamLiveAudio] attach falhou:', msg(e)); } catch (_) {}
      return false;
    }
  }

  function detach(id) {
    try {
      id = String(id);
      var ch = channels[id];
      delete pending[id];
      if (!ch) return;
      delete channels[id];
      safeDisconnect(ch.src, ch.gain);   // o nó de origem fica no WeakMap para um futuro attach do mesmo elemento
      safeDisconnect(ch.gain); safeDisconnect(ch.an); safeDisconnect(ch.mon);
    } catch (_) {}
  }

  function setParams(id, p) {
    try {
      id = String(id);
      p = p || {};
      var ch = channels[id];
      var base = ch ? ch.params : (pending[id] || defaults());
      var next = {
        volume: p.volume === undefined ? base.volume : defaults({ volume: p.volume }).volume,
        muted: p.muted === undefined ? base.muted : !!p.muted,
        visible: p.visible === undefined ? base.visible : !!p.visible,
        monitor: p.monitor === undefined ? base.monitor : !!p.monitor,
      };
      if (ch) { ch.params = next; applyParams(ch); } else pending[id] = next;
    } catch (_) {}
  }

  function levels() {
    var out = { master: FLOOR_DB, channels: {} };
    try {
      if (!ctx || ctx.state === 'closed') return out;
      out.master = peakDb(masterAn);
      for (var id in channels) out.channels[id] = peakDb(channels[id].an);
    } catch (_) {}
    return out;
  }

  function resume() {
    try {
      if (!ctx) return Promise.resolve(false);
      if (ctx.state === 'suspended') return ctx.resume().then(function () { return ctx.state === 'running'; }, function () { return false; });
      return Promise.resolve(ctx.state === 'running');
    } catch (_) { return Promise.resolve(false); }
  }

  /* ───────────────────────── suporte AAC ───────────────────────── */

  function aacConfig(kbps) {
    return { codec: AAC_CODEC, sampleRate: SR, numberOfChannels: 2, bitrate: (kbps || 128) * 1000, aac: { format: 'aac' } };
  }

  function supported() {
    if (supportedP) return supportedP;
    supportedP = (async function () {
      try {
        if (typeof AudioEncoder === 'undefined' || typeof AudioData === 'undefined') return false;
        if (typeof AudioWorkletNode === 'undefined') return false;
        var s = await AudioEncoder.isConfigSupported(aacConfig(128));
        return !!(s && s.supported);
      } catch (_) { return false; }
    })();
    return supportedP;
  }

  /* ───────────────────────── captura / codificação ───────────────────────── */

  var WORKLET_SRC =
    "class CamLiveSink extends AudioWorkletProcessor {\n" +
    "  process(inputs, outputs) {\n" +
    "    var inp = inputs[0], n = 128, l, r;\n" +
    "    if (inp && inp.length > 0 && inp[0] && inp[0].length) { n = inp[0].length; l = inp[0].slice(); r = (inp[1] || inp[0]).slice(); }\n" +
    "    else { l = new Float32Array(n); r = new Float32Array(n); }\n" +
    "    this.port.postMessage([l, r], [l.buffer, r.buffer]);\n" +
    "    return true;\n" +
    "  }\n" +
    "}\n" +
    "registerProcessor('camlive-sink', CamLiveSink);\n";

  async function ensureWorklet() {
    if (workletReady) return;
    var url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
    try { await ctx.audioWorklet.addModule(url); } finally { try { URL.revokeObjectURL(url); } catch (_) {} }
    workletReady = true;
  }

  async function startCapture(opts) {
    var local = null;
    try {
      opts = opts || {};
      if (cap) return { ok: false, error: 'A captura de áudio já está em andamento.' };
      if (!opts.rawPcm && !(await supported())) return { ok: false, error: 'Este Electron não codifica áudio AAC (WebCodecs AudioEncoder indisponível).' };
      if (opts.rawPcm ? typeof opts.onPcm !== 'function' : typeof opts.onPacket !== 'function') return { ok: false, error: 'Falta o callback onPacket para receber o áudio codificado.' };
      var t0Ms = typeof opts.t0Ms === 'number' ? opts.t0Ms : performance.now();
      var kbps = opts.bitrateKbps > 0 ? opts.bitrateKbps : 128;

      ensureCtx();
      if (ctx.state === 'suspended') { try { await Promise.race([ctx.resume(), new Promise(function (r) { setTimeout(r, 1500); })]); } catch (_) {} }
      if (ctx.state !== 'running') return { ok: false, error: 'O áudio do navegador está bloqueado até um clique do usuário. Clique na tela e tente transmitir de novo.' };
      await ensureWorklet();

      local = {
        rawPcm: !!opts.rawPcm, onPcm: opts.onPcm, t0Ms: t0Ms, onAsc: opts.onAsc, onPacket: opts.onPacket, onError: opts.onError,
        enc: null, node: null, mute: null, sentAsc: false, base: null, acc: 0, fill: 0,
        L: new Float32Array(BLOCK), R: new Float32Array(BLOCK), stopped: false, failed: null,
        packets: 0, bytes: 0,
      };
      if (!local.rawPcm) { local.enc = new AudioEncoder({
        output: function (chunk, meta) {
          try {
            if (!local.sentAsc && meta && meta.decoderConfig && meta.decoderConfig.description) {
              local.sentAsc = true;
              if (typeof local.onAsc === 'function') local.onAsc(new Uint8Array(meta.decoderConfig.description));
            }
            var data = new Uint8Array(chunk.byteLength); chunk.copyTo(data);
            local.packets++; local.bytes += data.length;
            local.onPacket({ data: data, ptsUs: chunk.timestamp });
          } catch (e) { fail(local, e); }
        },
        error: function (e) { fail(local, e); },
      });
      local.enc.configure(aacConfig(kbps)); }

      var node = new AudioWorkletNode(ctx, 'camlive-sink', {
        numberOfInputs: 1, numberOfOutputs: 1, outputChannelCount: [2],
        channelCount: 2, channelCountMode: 'explicit', channelInterpretation: 'speakers',
      });
      var mute = ctx.createGain(); mute.gain.value = 0;
      node.onprocessorerror = function () { fail(local, new Error('o processador de áudio falhou')); };
      node.port.onmessage = function (ev) { onBlock(local, ev.data); };
      master.connect(node); node.connect(mute); mute.connect(ctx.destination);
      local.node = node; local.mute = mute;
      cap = local;
      return { ok: true };
    } catch (e) {
      if (local) { try { await teardown(local, false); } catch (_) {} }
      if (cap === local) cap = null;
      return { ok: false, error: 'Falha ao iniciar a captura de áudio: ' + msg(e) };
    }
  }

  function fail(c, e) {
    if (c.failed) return;
    c.failed = msg(e);
    try { console.warn('[CamLiveAudio] erro:', c.failed); } catch (_) {}
    try { if (typeof c.onError === 'function') c.onError('Erro no áudio: ' + c.failed); } catch (_) {}
  }

  function onBlock(c, data) {
    if (c.stopped || c.failed || (!c.rawPcm && (!c.enc || c.enc.state !== 'configured'))) return;
    if (c.base === null) c.base = performance.now() - WORKLET_FRAMES * 1000 / SR;   // início do primeiro bloco
    var l = data[0], r = data[1], n = l.length, off = 0;
    while (off < n) {
      var take = Math.min(n - off, BLOCK - c.fill);
      c.L.set(l.subarray(off, off + take), c.fill);
      c.R.set(r.subarray(off, off + take), c.fill);
      c.fill += take; off += take;
      if (c.fill === BLOCK) { encodeBlock(c); c.fill = 0; }
    }
  }

  function encodeBlock(c) {
    try {
      if (c.rawPcm) {
        var pcm = new Int16Array(BLOCK);
        for (var i = 0; i < BLOCK; i++) {
          var sample = Math.max(-1, Math.min(1, (c.L[i] + c.R[i]) / 2));
          pcm[i] = Math.round(sample * (sample < 0 ? 32768 : 32767));
        }
        c.onPcm({data: new Uint8Array(pcm.buffer), sampleRate: ctx.sampleRate});
        c.acc += BLOCK;
        return;
      }
      var planar = new Float32Array(BLOCK * 2);
      planar.set(c.L, 0); planar.set(c.R, BLOCK);
      var ts = Math.round((c.base - c.t0Ms) * 1000 + c.acc * 1000 / SR);
      var ad = new AudioData({ format: 'f32-planar', sampleRate: SR, numberOfFrames: BLOCK, numberOfChannels: 2, timestamp: ts, data: planar });
      try { c.enc.encode(ad); } finally { ad.close(); }
      c.acc += BLOCK;
    } catch (e) { fail(c, e); }
  }

  async function teardown(c, flush) {
    c.stopped = true;
    try { if (c.node) { c.node.port.onmessage = null; c.node.onprocessorerror = null; } } catch (_) {}
    if (c.node) { safeDisconnect(master, c.node); safeDisconnect(c.node); }
    if (c.mute) safeDisconnect(c.mute);
    try { if (c.node) c.node.port.close(); } catch (_) {}
    var enc = c.enc; c.enc = null;
    if (enc) {
      if (flush && c.fill > 0 && c.base !== null && !c.failed) {      // completa o último bloco com silêncio
        try {
          c.L.fill(0, c.fill); c.R.fill(0, c.fill);
          c.enc = enc; c.stopped = false; encodeBlock(c); c.stopped = true; c.enc = null;
        } catch (_) {}
      }
      if (flush && enc.state === 'configured') { try { await enc.flush(); } catch (_) {} }
      try { if (enc.state !== 'closed') enc.close(); } catch (_) {}
    }
  }

  async function stopCapture() {
    var c = cap; cap = null;
    if (!c) return { ok: true };
    try { await teardown(c, true); } catch (_) {}
    return { ok: !c.failed, packets: c.packets, bytes: c.bytes, error: c.failed || undefined };
  }

  window.CamLiveAudio = {
    attach: attach, detach: detach, setParams: setParams, levels: levels,
    resume: resume, supported: supported, startCapture: startCapture, stopCapture: stopCapture,
  };
})();

</script>

    if (a === 'eye') { const it = findItem(id); if (it) toggleVisible(it); }
    if (a === 'lock') { const it = findItem(id); if (it) toggleLock(it); }
    if (a === 'mute') { const it = findItem(id); if (it) { it.muted = !it.muted; applyAudio(it); save(); paintDocks(); } }
    if (a === 'monitor') { const it = findItem(id); if (it) { it.monitor = !it.monitor; applyAudio(it); save(); paintDocks(); } }
    if (a === 'add') { const r = el.getBoundingClientRect(); addMenu(r.left, r.bottom + 2); }
    if (a === 'src-del') R.sel && removeItem(R.sel);
    if (a === 'src-up') moveItem(R.sel, true);
    if (a === 'src-down') moveItem(R.sel, false);
    if (a === 'src-rename') R.sel && startEdit(R.sel);
    if (a === 'src-props') openProps(R.sel);
    if (a === 'stream') (R.streaming ? stopStreaming() : startStreaming());
    if (a === 'settings') { R.modal = { type: 'settings' }; paintModal(); }
    if (a === 'modal-close') { R.modal = null; paintModal(); }
    if (a === 'modal-ok') modalOk();
    if (a === 'modal-rot90' || a === 'modal-rot0') { const f = q('#f-rot'); if (f) { const cur = parseFloat(f.value) || 0; f.value = a === 'modal-rot0' ? 0 : ((Math.round(cur / 90) * 90 + 90 + 180) % 360) - 180; } }
    if (a === 'modal-fit' || a === 'modal-cover' || a === 'modal-stretch') { const m = R.modal, it = findItem(m.id); if (it) { fitItem(it, a === 'modal-fit' ? 'fit' : a === 'modal-cover' ? 'cover' : 'stretch'); R.modal = { ...m }; save(); paintModal(); } }
    if (a === 'modal-reopen') {
      const m = R.modal, it = findItem(m.id);
      if (it) pickFiles(it.kind, false, (fs) => { const f = fs[0]; it.path = f.name; delete R.missing[it.id]; idbPut(it.id, f); mountFile(it, f, true); R.modal = { ...m }; save(); paint(); });
    }
  }
  function onDbl(e) {
    if (e.target.closest('.oic') || e.target.closest('[data-edit]')) return;
    const el = e.target.closest('[data-m="item"]'); if (el) startEdit(el.dataset.id);
  }
  function onKey(e) {
    if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-edit')) {
      e.stopPropagation();
      if (e.key === 'Enter') { e.preventDefault(); commitEdit(); } else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
      return;
    }
    if (!R.modal) return; e.stopPropagation();
    if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') modalOk();
    if (e.key === 'Escape') { R.modal = null; paintModal(); }
  }
  function onCtx(e) {
    const it = e.composedPath().find((n) => n.dataset && n.dataset.m === 'item');
    if (it) { e.preventDefault(); itemMenu(e, it.dataset.id); }
  }
  function onChange(e) {
    if (e.target.id === 'f-target') { const usb = e.target.value === 'iphone'; q('#f-rtmp').style.display = usb ? 'none' : ''; q('#f-usb-note').style.display = usb ? '' : 'none'; }
    if (e.target.id === 'f-preset') { const p = PRESETS.find((x) => x.id === e.target.value); if (p && p.url) { q('#f-url').value = p.url; q('#f-key').value = p.key; } q('#f-rtmp-settings').style.display = e.target.value === 'iphone' ? 'none' : ''; q('#f-usb-info').style.display = e.target.value === 'iphone' ? '' : 'none'; }
    if (e.target.id === 'f-ratio') setFormat({ ratio: e.target.value });
    if (e.target.dataset && e.target.dataset.vol) save();
  }
  function onInput(e) {
    const id = e.target.dataset && e.target.dataset.vol; if (!id) return;
    const it = findItem(id); if (!it) return; it.volume = Math.max(0, Math.min(1, +e.target.value / 100));
    applyAudio(it); const lbl = q(`[data-volv="${id}"]`); if (lbl) lbl.textContent = Math.round(it.volume * 100) + '%'; save();
  }
  function onFocusOut(e) { if (R.painting) return; if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-edit') && R.editing) commitEdit(); }
  const hasFiles = (e) => !!(e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files'));
  let dropT = 0;
  function onDragOver(e) {
    if (R.min || !hasFiles(e)) return; e.preventDefault(); try { e.dataTransfer.dropEffect = 'copy'; } catch (_) {}
    panel.classList.add('dropping'); clearTimeout(dropT); dropT = setTimeout(() => panel.classList.remove('dropping'), 160);
  }
  function onDrop(e) {
    if (R.min || !hasFiles(e)) return; e.preventDefault(); clearTimeout(dropT); panel.classList.remove('dropping');
    const fs = [...e.dataTransfer.files]; if (fs.length) addFiles(fs);
  }

  let pairedPhoneControl = null;
  function syncPhoneControlPosition() {
    const header = document.querySelector('.pm-drag');
    const phone = document.querySelector('[data-phone-control-window]') ||
      header?.closest('.react-draggable') || header?.parentElement;
    if (!phone || phone.hidden) {
      pairedPhoneControl = null;
      return;
    }
    if (pairedPhoneControl === phone) return;
    const rect = phone.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    pairedPhoneControl = phone;
    placeBesidePhoneControl(rect);
    applyGeom();
  }
  function placeBesidePhoneControl(rect) {

    const gap = 8;
    const right = innerWidth - rect.right - gap * 2;
    const left = rect.left - gap * 2;
    const onRight = right >= MIN_W || right >= left;
    const available = onRight ? right : left;
    if (available >= 360) {
      G.w = Math.min(G.w, available);
      G.x = onRight ? rect.right + gap : rect.left - gap - G.w;
      G.y = rect.top;
      return;
    }

    const below = innerHeight - rect.bottom - gap * 2;
    const above = rect.top - gap * 2;
    const onBottom = below >= MIN_H || below >= above;
    const height = onBottom ? below : above;
    if (height >= 300) {
      G.h = Math.min(G.h, height);
      G.x = rect.left;
      G.y = onBottom ? rect.bottom + gap : rect.top - gap - G.h;
    }
  }
  async function openWindow() {
    ensureHost(); if (!R.loaded) await load();
    if (!panel) {
      buildPanel(); const root = shadow.querySelector('.root');
      root.addEventListener('click', onClick); root.addEventListener('dblclick', onDbl); root.addEventListener('keydown', onKey); root.addEventListener('contextmenu', onCtx);
      root.addEventListener('change', onChange); root.addEventListener('input', onInput); root.addEventListener('focusout', onFocusOut);
      root.addEventListener('dragover', onDragOver); root.addEventListener('drop', onDrop);
    } else panel.style.display = 'flex';
    R.open = true; R.min = false;
    pairedPhoneControl = null; syncPhoneControlPosition();
    renderPanel(); reconcile(); playAll(); ensureLoop(); updateButton();
  }
  function closeWindow() {
    R.open = false; if (panel) panel.style.display = 'none'; closeCtx();
    if (!R.streaming) { for (const id of [...rt.keys()]) { const it = findItem(id); if (it && (it.kind === 'screen' || it.kind === 'camera')) unmount(id); } pauseAll(); }
    updateButton();
  }
  function toggleWindow() { (R.open ? closeWindow : openWindow)(); }

  let btn = null;
  function updateButton() {
    if (!btn) return; const on = R.open, live = R.streaming;
    btn.style.background = on ? 'rgba(255,176,32,.2)' : 'rgba(255,176,32,.07)'; btn.style.borderColor = on ? 'rgba(255,176,32,.85)' : 'rgba(255,176,32,.35)';
    btn.style.boxShadow = on ? '0 0 15px rgba(255,176,32,.55)' : 'none';
    const dot = btn.querySelector('[data-cl-dot]'); if (dot) dot.style.display = live ? 'inline-block' : 'none';
  }
  function injectButton() {
    if (document.getElementById('nova-cam-live-btn')) return;
    const ref = [...document.querySelectorAll('button')].find((b) => /^\s*(?:AI Upload|Envio com IA)\s*$/i.test(b.textContent || ''));
    if (!ref) return;
    btn = ref.cloneNode(true); btn.id = 'nova-cam-live-btn'; btn.removeAttribute('title');
    btn.className = ref.className.split(/\s+/).filter((c) => !/red-|text-red|bg-red|border-red/.test(c)).join(' ');
    btn.innerHTML = `<span data-cl-dot style="display:none;width:7px;height:7px;border-radius:50%;background:#ff3b3b;box-shadow:0 0 8px #ff3b3b"></span>${ic('video', 13)}<span>CAM LIVE</span>`;
    Object.assign(btn.style, { color: '#ffb020', border: '1px solid rgba(255,176,32,.35)', background: 'rgba(255,176,32,.07)', fontFamily: "'Righteous', cursive" });
    btn.addEventListener('mouseenter', () => { if (!R.open) btn.style.background = 'rgba(255,176,32,.18)'; });
    btn.addEventListener('mouseleave', updateButton);
    btn.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); toggleWindow(); });
    ref.insertAdjacentElement('afterend', btn); updateButton();
  }
  let mo = null, moT = 0;
  function watch() {
    injectButton();
    mo = new MutationObserver(() => {
      if (R.open && !R.min) syncPhoneControlPosition();
      if (moT || document.getElementById('nova-cam-live-btn')) return;
      moT = setTimeout(() => { moT = 0; injectButton(); }, 150);
    });
    mo.observe(document.body, { childList: true, subtree: true, attributeFilter: ['hidden'] });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', watch); else watch();

  window.camLive = { open: openWindow, close: closeWindow, toggle: toggleWindow, state: () => ({ P, R, G }), startStreaming, stopStreaming, addFiles, setFormat, _enc: () => enc };
  ipcLog('módulo CAM LIVE carregado; WebCodecs=' + (typeof VideoEncoder !== 'undefined') + '; CamLiveAudio=' + !!audio());
  if (typeof VideoEncoder !== 'undefined') {
    VideoEncoder.isConfigSupported({ codec: 'avc1.4d001f', width: 1280, height: 720, bitrate: 2500000, framerate: 30, latencyMode: 'realtime', avc: { format: 'avc' }, hardwareAcceleration: 'prefer-hardware' }).then((s) => ipcLog('H.264 hardware suportado=' + s.supported)).catch((e) => ipcLog('H.264 hw erro ' + e.message));
    VideoEncoder.isConfigSupported({ codec: 'avc1.4d001f', width: 1280, height: 720, bitrate: 2500000, framerate: 30, latencyMode: 'realtime', avc: { format: 'avc' }, hardwareAcceleration: 'prefer-software' }).then((s) => ipcLog('H.264 software suportado=' + s.supported)).catch((e) => ipcLog('H.264 sw erro ' + e.message));
  }
})();

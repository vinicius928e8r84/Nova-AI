<!doctype html>
<html lang="pt-BR"><meta charset="utf-8">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: #04090c; color: #cfe0e5;
    font-family: Inter, -apple-system, 'Segoe UI', sans-serif;
    background-image: radial-gradient(circle at 18% 12%, rgba(0,213,237,.08), transparent 42%),
                      radial-gradient(circle at 86% 78%, rgba(0,120,200,.09), transparent 40%); }
  .wrap { padding: 44px; }
  .panel { max-width: 1180px; margin: 0 auto; border: 1px solid #17262d; border-radius: 16px;
    background: rgba(7,14,18,.92); box-shadow: 0 30px 90px rgba(0,0,0,.6); overflow: hidden; }
  .panel-head { display: flex; align-items: center; gap: 14px; padding: 18px 24px; border-bottom: 1px solid #132129; }
  .panel-head h1 { margin: 0; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #dff3f6; }
  .panel-head span { font: 600 10px/1 ui-monospace, monospace; letter-spacing: .14em; color: #00d5ed;
    border: 1px solid rgba(0,213,237,.3); background: rgba(0,213,237,.07); padding: 5px 8px; border-radius: 6px; }
  .tabs { display: flex; gap: 26px; padding: 16px 24px; border-bottom: 1px solid #132129;
    font: 600 11px/1 ui-monospace, monospace; letter-spacing: .1em; text-transform: uppercase; color: #6d838c; }
  .tabs b { color: #00d5ed; }
  .body { padding: 26px 24px 34px; display: grid; gap: 16px; }
  .card { border: 1px solid #1b2c34; border-radius: 12px; padding: 18px; background: #08131a; }
  .card h2 { margin: 0 0 10px; font: 600 11px/1.4 ui-monospace, monospace; letter-spacing: .16em;
    color: #00d5ed; text-transform: uppercase; }
  .card p { margin: 0; color: #8ea3aa; font-size: 13px; line-height: 1.7; }
  .ghost-btn { display: inline-block; margin-top: 14px; padding: 12px 18px; border-radius: 10px;
    background: #00d5ed; color: #032127; font-weight: 700; font-size: 13px; }
</style>
<div class="wrap">
  <div class="panel">
    <div class="panel-head"><h1>Controle do Celular</h1><span>Suite de Hardware</span></div>
    <div class="tabs"><b>Dispositivos (1)</b><span>Controles</span><span>Aplicativos</span><span>Navegador</span></div>
    <div class="body">
      <div class="card">
        <h2>iOS—47F4FC34C3ACF770EB4E3561CAD85FCARDCAC298</h2>
        <p>Interface USB · Jailbreak</p>
        <div class="ghost-btn">Conectar</div>

        <h2>Como conectar seu iPhone</h2>
        <p>Conecte o iPhone ao Mac por cabo USB, toque em Confiar e mantenha o jailbreak ativo.</p>
      </div>
    </div>

</div>
</html>
